        assert_type(remote.call_with_timeout(None, Methods.add, a=1, b=2), int)

- case: sync_class_methods_keep_argument_and_result_types
  main: |
    from typing import assert_type
    from rmote.protocol import Tool
    from rmote.sync import Connection

    class Methods(Tool):
        @classmethod
        def label(cls, value: str) -> str:
            return value

        @classmethod
        async def async_label(cls, value: str) -> str:
            return value

    def check(remote: Connection) -> None:
        assert_type(remote(Methods.label, value="hello"), str)
        assert_type(remote.call_with_timeout(1.0, Methods.label, "hello"), str)
        assert_type(remote(Methods.async_label, "hello"), str)
        assert_type(remote.call_with_timeout(1.0, Methods.async_label, value="hello"), str)

- case: sync_dataclass_results_keep_their_type
  main: |
    from dataclasses import dataclass
    from typing import assert_type
    from rmote.protocol import Tool
    from rmote.sync import Connection

    @dataclass
    class Report:
        count: int

    class Methods(Tool):
        @staticmethod
        def report(count: int) -> Report:
            return Report(count)

        @staticmethod
        async def identity(value: Report) -> Report:
            return value

    def check(remote: Connection) -> None:
        assert_type(remote(Methods.report, count=3), Report)
        assert_type(remote.call_with_timeout(1.0, Methods.report, 3), Report)
        assert_type(remote(Methods.identity, Report(3)), Report)
        assert_type(remote.call_with_timeout(None, Methods.identity, value=Report(3)), Report)

- case: sync_factories_and_context_keep_self_type
  main: |
    from typing import assert_type
    from rmote.sync import Connection

    class Specialized(Connection):
        pass

    def check() -> None:
        assert_type(Connection.from_local(), Connection)
        assert_type(Connection.from_ssh("host"), Connection)
        assert_type(Specialized.from_local(), Specialized)
        assert_type(Specialized.from_ssh("host"), Specialized)
        with Connection.from_local() as remote:
            assert_type(remote, Connection)
            assert_type(remote.close(), None)
        with Specialized.from_local() as specialized:
            assert_type(specialized, Specialized)

- case: sync_remote_keywords_do_not_conflict_with_client_parameters
  main: |
    from typing import assert_type
    from rmote.protocol import Tool
    from rmote.sync import Connection

    class Methods(Tool):
        @staticmethod
        def keywords(*, timeout: int, tool: str) -> tuple[int, str]:
            return timeout, tool

    def check(remote: Connection) -> None:
        assert_type(remote(Methods.keywords, timeout=3, tool="remote"), tuple[int, str])
        assert_type(remote.call_with_timeout(1.0, Methods.keywords, timeout=3, tool="remote"), tuple[int, str])

- case: sync_invalid_arguments_and_result_types_are_rejected
  mypy_config: |
    python_version = 3.11
    warn_unused_ignores = True
  main: |
    from rmote.protocol import Tool
    from rmote.sync import Connection

    class Methods(Tool):
        @staticmethod
        def add(a: int, b: int) -> int:
            return a + b

        @staticmethod
        async def async_add(a: int, b: int) -> int:
            return a + b

    def check(remote: Connection) -> None:
        # Unused ignores fail if the API stops detecting an expected error.
        remote(Methods.add, "wrong", 2)  # type: ignore[call-overload]
        remote(Methods.add, 1)  # type: ignore[call-overload]
        remote(Methods.add, 1, 2, unexpected=3)  # type: ignore[call-arg, arg-type]
        remote.call_with_timeout(1.0, Methods.async_add, "wrong", 2)  # type: ignore[call-overload]
        wrong: str = remote(Methods.add, 1, 2)  # type: ignore[assignment]
        wrong_async: str = remote.call_with_timeout(None, Methods.async_add, 1, 2)  # type: ignore[assignment]
