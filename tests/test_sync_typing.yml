- case: sync_static_methods_return_results
  main: |
    from typing import assert_type
    from rmote.protocol import Tool
    from rmote.sync import Connection

    class Methods(Tool):
        @staticmethod
        def add(a: int, b: int) -> int:
            return a + b

        @staticmethod
        def label(value: str) -> str:
            return value

    def check(remote: Connection) -> None:
        assert_type(remote(Methods.add, 1, 2), int)
        assert_type(remote.call_with_timeout(1.0, Methods.add, a=1, b=2), int)
        assert_type(remote(Methods.label, "hello"), str)

- case: sync_async_methods_return_awaited_results
  main: |
    from typing import assert_type
    from rmote.protocol import Tool
