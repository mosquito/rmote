name: tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FORCE_COLOR: 1

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run mypy .

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONASYNCIODEBUG: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          # Free-threaded builds. Every dependency of the tests has a wheel
          # for them, so a runner needs no compiler.
          - "3.13t"
          - "3.14t"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: Prepare isolated SSH server support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
      - name: Build wheel and source distribution
        run: uv build --out-dir "$RUNNER_TEMP/rmote-dist" --no-create-gitignore
      - name: Test APIs, installed artifacts, and executable documentation
        run: >-
          uv run pytest -vv --no-docker --require-ssh --timeout=30
          -W error::RuntimeWarning -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          -W error::pytest.PytestUnhandledThreadExceptionWarning
          --cov=rmote --cov-report=term-missing

  docker-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Check Docker availability
        run: docker info
      - name: Test Linux package and system tools
        run: uv run pytest -vv -m docker --timeout=180
